# Загрузка папки site/ на хостинг (SpaceWeb) по FTP при каждом изменении в main.
# Нужны секреты репозитория: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD,
# FTP_DIR (папка сайта на хостинге, например chistka-39.ru/public_html/).
# Пока секретов нет, загрузка пропускается.
# Заявки с сайта (site/lead.php → Telegram): секреты TG_BOT_TOKEN и TG_CHAT_ID
# (несколько chat_id через запятую), TG_RELAY_URL — адрес пересылки (tools/telegram-relay.gs:
# с хостинга в РФ api.telegram.org недоступен), по желанию LEAD_EMAIL — запасной адрес почты.
# Из них перед загрузкой пишется site/lead-config.php (в git его нет).
name: Загрузка на хостинг

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Секреты FTP не заданы — пропускаю
        if: env.FTP_SERVER == ''
        run: echo "Добавьте FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR в Settings → Secrets → Actions"
      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''
      - name: Настройки приёма заявок (lead-config.php из секретов)
        if: env.FTP_SERVER != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LEAD_EMAIL: ${{ secrets.LEAD_EMAIL }}
          TG_RELAY_URL: ${{ secrets.TG_RELAY_URL }}
        run: |
          python3 - <<'PY'
          import os
          def q(v):
              return "'" + v.strip().replace("\\", "\\\\").replace("'", "\\'") + "'"
          cfg = {"tg_token": os.environ.get("TG_BOT_TOKEN", ""),
                 "tg_chat": os.environ.get("TG_CHAT_ID", ""),
                 "tg_relay": os.environ.get("TG_RELAY_URL", ""),
                 "email": os.environ.get("LEAD_EMAIL", "")}
          body = ",\n".join(f"    {q(k)} => {q(v)}" for k, v in cfg.items())
          open("site/lead-config.php", "w").write("<?php\nreturn [\n" + body + "\n];\n")
          print("Заявки, заданы:", ", ".join(k for k, v in cfg.items() if v.strip()) or "ничего", "| пусто:", ", ".join(k for k, v in cfg.items() if not v.strip()) or "—")
          PY
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: env.FTP_SERVER != ''
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: ${{ secrets.FTP_DIR }}
      - name: Сообщить Яндексу и Bing об изменённых страницах (IndexNow)
        if: env.FTP_SERVER != ''
        run: python3 tools/indexnow.py
